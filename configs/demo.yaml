# Small 2-week run committed to git (data/generated/demo/) so the dashboard works right
# after cloning. Inherits everything from default.yaml; only overrides are listed.
extends: default.yaml
run_id: demo
paths:
  compress: true
time:
  duration_days: 14
split:
  normal_days: 4
  train_days: 3
  val_days: 3
  test_days: 4
injection:
  events_per_block: {train: 1, val: 1, test: 2}
  compound_in_test: 0
  min_gap_min: 120
  PHYS_BEARING_DEGRADATION: {targets: [PUMP1, COMP1], h_max: [2.2, 3.0], duration_days: [1.0, 1.3]}
  SENS_DRIFT: {targets: [PUMP1, COMP1], rate_pct_per_day: [2.0, 4.0], sign: [-1, 1], duration_days: [0.4, 0.8]}
  FALS_ENERGY: {targets: [PUMP1, COMP1, AUX1], underreport: [0.10, 0.40], duration_days: [0.4, 0.8]}
