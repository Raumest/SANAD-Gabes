# SANAD-Gabès default configuration.
# Fictional process plant in the Gabès industrial zone. All parameters are simulation
# assumptions. No measurement originates from a real company.
#
# Every assumption of the platform lives here. Documented in docs/data_card.md,
# docs/injection_table.md and docs/governance.md.

run_id: main
data_source: synthetic          # synthetic | real (real = adapter stubs, Phase 2)
seed: 20261015                  # master seed; every random process derives from it

paths:
  generated_dir: data/generated
  processed_dir: data/processed
  reports_dir: reports
  raw_dir: data/raw
  compress: false               # write *.csv.gz instead of *.csv

time:
  start_utc: "2025-06-02T00:00:00Z"   # a Monday; 8 weeks of early-summer operation
  duration_days: 56
  resolution_min: 1                   # Phase 1: everything at 1 min (see docs/data_card.md)
  utc_offset_h: 1                     # Tunisia (CET, no DST) for shift profiles

# Time-block split (days from start). Embargo hours at the start of each later block are
# excluded from event placement and from evaluation.
split:
  normal_days: 14
  train_days: 14
  val_days: 14
  test_days: 14
  embargo_hours: 24

plant:
  node_id: GAB-N1
  v_ll_nominal: 400.0
  f_nominal: 50.0
  transformer_kva: 1000.0
  bus:
    loss_frac: 0.015                  # LV cable/busbar losses as fraction of sum of feeders
    loss_frac_q: 0.02
    unmetered_kw: 2.0                 # small unmetered loads (controls, sockets)
    unmetered_kvar: 1.0
    unmetered_noise_kw: 0.3
  grid:
    v_daily_amp: 0.008                # relative daily voltage swing
    v_ar_phi: 0.995
    v_ar_sigma: 0.0004
    phase_unbalance: [0.003, -0.001, -0.002]
    f_ar_phi: 0.95
    f_ar_sigma: 0.004
    thd_v_mean: 2.8
  equipment:
    PUMP1:
      type: motor
      description: Seawater/process pump, induction motor, 4-pole
      p_rated_kw: 90.0
      eta_rated: 0.945
      no_load_loss_share: 0.30        # share of rated losses that are load-independent
      slip_rated: 0.012
      poles: 4
      tau_thermal_min: 30.0
      dtheta_rated_k: 70.0
      share: 0.85                     # fraction of the plant envelope
      current_unbalance: [0.008, -0.003, -0.005]
      vib_v0_g: 0.05
      vib_kl_g: 0.10
      vib_nde_ratio: 0.85             # healthy NDE / DE level
      inrush_multiple: 6.0
      inrush_decay_s: 6.0
      daily_pause: true               # one process pause per night (natural restart)
    COMP1:
      type: motor
      description: Process compressor, induction motor, 4-pole, load/unload cycling
      p_rated_kw: 132.0
      eta_rated: 0.952
      no_load_loss_share: 0.30
      slip_rated: 0.010
      poles: 4
      tau_thermal_min: 35.0
      dtheta_rated_k: 75.0
      share: 0.92
      unload_fraction: 0.25           # load level while unloaded
      cycle_load_min: [8, 25]         # loaded dwell (min)
      cycle_unload_min: [3, 10]       # unloaded dwell (min)
      night_off: [23, 5]              # local hours off on weekdays; off all weekend
      current_unbalance: [-0.006, 0.010, -0.004]
      vib_v0_g: 0.06
      vib_kl_g: 0.12
      vib_nde_ratio: 0.80
      inrush_multiple: 6.5
      inrush_decay_s: 7.0
    AUX1:
      type: aux
      description: Lighting, HVAC, small drives
      p_rated_kw: 60.0
      share: 0.55
      hvac_gain: 0.25                 # extra load per (T_amb-25)/15
      pf: 0.92
      current_unbalance: [0.012, -0.004, -0.008]

load:
  # local-hour envelope breakpoints (hour, level); linear interpolation
  weekday_profile: [[0, 0.45], [6, 0.45], [8, 0.88], [12, 0.90], [13, 0.82], [14, 0.90], [17, 0.86], [19, 0.70], [22, 0.50], [24, 0.45]]
  weekend_factor: 0.60
  ar_phi: 0.97
  ar_sigma: 0.010                     # innovation sigma of the AR(1) multiplicative noise
  clip: [0.0, 1.4]
  op_state_thresholds: [0.40, 0.90]   # RUN_LOW < 0.40 <= RUN_NORMAL < 0.90 <= RUN_HIGH

climate:
  t_annual_mean_c: 20.5
  t_annual_amp_c: 8.5                 # peak around day-of-year 205
  t_daily_amp_c: 7.5                  # +/- around daily mean, peak 15:00 local
  t_ar_phi: 0.995
  t_ar_sigma: 0.08
  irradiance_peak_wm2: 1000.0

sensors:
  # 1-sigma relative gain error (installation), noise sigma (relative or absolute)
  meter: {class: "0.5S", gain_sigma: 0.0015, v_gain_sigma: 0.001, i_noise_rel: 0.001, v_noise_v: 0.15, pf_noise: 0.002, f_noise_hz: 0.003}
  bus_meter: {class: "0.2S", gain_sigma: 0.0008, v_gain_sigma: 0.0008, i_noise_rel: 0.0008, v_noise_v: 0.12, pf_noise: 0.0015, f_noise_hz: 0.003}
  relay_ct: {class: "5P10", gain_sigma: 0.004, i_noise_rel: 0.004}
  rtd: {class: "PT100 B", offset_sigma_k: 0.3, noise_k: 0.25}
  accelerometer: {class: "ISO 10816 IEPE", gain_sigma: 0.02, noise_g: 0.004}
  speed: {class: "encoder", noise_rpm: 1.0}
  ambient: {class: "PT100", noise_k: 0.15}
  rounding: {v: 0.1, i: 0.01, p: 0.01, pf: 0.001, f: 0.001, kwh: 0.01, temp: 0.1, vib: 0.001, speed: 0.1, thd: 0.01}

baseline_dq:                           # natural imperfections injected into normal data too
  mcar_missing_rate: 0.0005            # per value
  spike_rate: 0.0002                   # per value, single-minute
  spike_rel: [0.15, 0.5]
  jitter_s: 0.6                        # device timestamp jitter (sigma, s)
  delayed_rate: 0.002                  # rows reported DELAYED (device clock lag 5-30 s)

# Phase 1 injection library (CLAUDE.md section 7). Ranges are [min, max].
injection:
  events_per_block: {train: 3, val: 3, test: 6}   # per label (train+val >= 6)
  min_gap_min: 120                    # gap between two events on the same equipment track
  compound_in_test: 1                 # compound pairs (real overload + meter CT drift)
  PHYS_OVERLOAD: {targets: [PUMP1, COMP1], load: [1.10, 1.40], duration_min: [10, 60]}
  PHYS_BEARING_DEGRADATION: {targets: [PUMP1, COMP1], h_max: [2.2, 3.0], duration_days: [3.0, 3.6]}
  GRID_SAG: {v_factor: [0.40, 0.88], duration_min: [1, 3]}
  GRID_INTERRUPTION: {duration_min: [2, 12], coast_tau_min: 1.0}
  SENS_DRIFT: {targets: [PUMP1, COMP1], rate_pct_per_day: [0.8, 2.5], sign: [-1, 1], duration_days: [1.0, 2.5]}
  SENS_BIAS:
    targets_voltage: [BUS1, PUMP1, COMP1, AUX1]
    targets_temperature: [PUMP1, COMP1]
    targets_current: [PUMP1, COMP1]
    voltage_v: [3.0, 8.0]
    temperature_k: [4.0, 10.0]
    current_pct_rated: [1.5, 3.0]
    duration_min: [180, 720]
  SENS_STUCK: {targets: [PUMP1, COMP1], channels: [METER, RTD, SPEED, ACC_DE], duration_min: [20, 360]}
  DQ_MISSING: {targets: [BUS1, PUMP1, COMP1, AUX1], mcar_rate: [0.01, 0.05], window_min: [120, 360], bursts: [1, 3], burst_min: [5, 60]}
  FALS_ENERGY: {targets: [PUMP1, COMP1, AUX1], underreport: [0.10, 0.40], duration_days: [1.0, 2.0]}
  COMM_DROPOUT: {targets: [BUS1, PUMP1, COMP1, AUX1], duration_min: [1, 120]}

# Mapping from injection label to output taxonomy (main_class / subtype)
taxonomy:
  NORMAL_START: [NORMAL, START]
  PHYS_OVERLOAD: [PHYSICAL_EQUIPMENT_FAULT, OVERLOAD]
  PHYS_BEARING_DEGRADATION: [PHYSICAL_EQUIPMENT_FAULT, BEARING_DEGRADATION]
  GRID_SAG: [GRID_EVENT, SUSTAINED_UNDERVOLTAGE]
  GRID_INTERRUPTION: [GRID_EVENT, INTERRUPTION]
  SENS_DRIFT: [SENSOR_FAULT, DRIFT]
  SENS_BIAS: [BIAS_MISCALIBRATION, BIAS]
  SENS_STUCK: [SENSOR_FAULT, STUCK]
  DQ_MISSING: [COMMUNICATION_PROBLEM, DATA_GAP]
  FALS_ENERGY: [CORRUPTION_FALSIFICATION, ENERGY_UNDERREPORT]
  COMM_DROPOUT: [COMMUNICATION_PROBLEM, DROPOUT]

detection:
  persistence: [2, 3]                 # flag active in >= 2 of the last 3 minutes
  z_threshold: 6.0                    # |z| on a single relation (per minute)
  ewma_lambda: 0.05
  ewma_margin: 1.3                    # threshold = margin * max |EWMA| on the normal block
  ewma_min: 1.0
  cusum_k: 0.5
  cusum_margin: 1.3
  cusum_min_h: 8.0
  cusum_cap_extra: 20.0               # cap = h + extra -> ~40 min to clear after recovery
  r5_window_min: 60
  flatline_min: 10
  episode_merge_gap_min: 15
  episode_min_len_min: 2
  overcurrent_pu: 1.04
  undervoltage_pu: 0.92
  interruption_pu: 0.10
  iforest: {n_estimators: 150, max_samples: 512, ood_margin: 0.02, min_len_min: 10}

diagnosis:
  vote_tolerance: 0.012               # relative current disagreement tolerated between paths
  drift_trend_ratio: 1.8              # |late|/|early| residual ratio that indicates drift
  null_evidence: 0.35                 # prior mass for "none of the hypotheses"

confidence:
  abstain_conf: 0.60
  abstain_margin: 0.15
  min_redundant_paths: 2
  calibration: isotonic               # isotonic | none

governance:
  auto_quarantine_conf: 0.85
  suspect_conf: 0.60
  short_gap_max_min: 15
  override_rate_limit: 0.25
  calibration_error_limit: 0.15
  second_look_rate: 0.05
  min_cases_for_trust: 5

audit:
  log_name: audit_log.jsonl

disclaimer: "Fictional process plant in the Gabès industrial zone. All parameters are simulation assumptions. No measurement originates from a real company."
